# Local-dev override — NOT loaded by Dokploy (it runs with an explicit
# `-f docker-compose.yml`, which does not auto-merge this file).
#
# The base compose is Dokploy-shaped: an external `proxy` network (Dokploy's
# `dokploy-network` + Traefik) and no host port. Locally there's no Traefik, so
# this override publishes the web container on the host so you can open
# http://localhost:8080 directly.
#
# Usage (from repo root):
#   just docker-up local
#
# Then visit http://localhost:8080  (stop with: docker compose down)
services:
  quran-init:
    # Same as web/api below: the base compose's `pull_policy: always` would
    # overwrite the locally built image with the registry copy.
    pull_policy: never
  web:
    # `just docker-up local` builds both images on this machine; the base compose's
    # `pull_policy: always` (for CI's mutable `latest`) would overwrite them with the
    # registry copy.
    pull_policy: never
    environment:
      # Base compose derives https://${DOMAIN}/api with DOMAIN=localhost — broken
      # for local docker (no TLS; api serves at root, no edge /api strip). Point
      # the browser at the published host port instead.
      PUBLIC_API_BASE_URL: http://localhost:8888
      PUBLIC_QURAN_API_BASE: http://localhost:8888/quran
    ports:
      - "127.0.0.1:8080:8080"
  api:
    pull_policy: never
    environment:
      # Flip the production boot gates off for local docker dev (the base
      # hardcodes APP_ENV=production / IP_SOURCE=CfConnectingIp).
      APP_ENV: development
      IP_SOURCE: ConnectInfo
      # The root .env mirrors production, so re-point mail + storage at local
      # fakes and neutralize the prod field key (empty = dev default).
      MAIL_PROVIDER: smtp
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "587"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      S3_ACCESS_KEY: devkey
      S3_SECRET_KEY: devsecret
      S3_ENDPOINT: http://localhost:9000
      FIELD_ENC_KEY: ""
    ports:
      - "127.0.0.1:8888:8888"
