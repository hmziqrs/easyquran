# Local-dev override — NOT loaded by Dokploy (it runs with an explicit
# `-f docker-compose.yml`, which does not auto-merge this file).
#
# The base compose is Dokploy-shaped: an external `proxy` network (Dokploy's
# `dokploy-network` + Traefik) and no host port. Locally there's no Traefik, so
# this override publishes the web container on the host so you can open
# http://localhost:8080 directly.
#
# Usage (from repo root):
#   just docker-up local
#
# Then visit http://localhost:8080  (stop with: docker compose down)
services:
  web:
    environment:
      ORIGIN: http://localhost:8080
      # Base compose derives https://${DOMAIN}/api with DOMAIN=localhost — broken
      # for local docker (no TLS; api serves at root, no edge /api strip). Point
      # the browser at the published host port instead.
      PUBLIC_API_BASE_URL: http://localhost:8888
      PUBLIC_QURAN_API_BASE: http://localhost:8888/quran
    ports:
      - "127.0.0.1:8080:8080"
  api:
    environment:
      # Flip the production boot gates off for local docker dev (the base
      # hardcodes RUST_ENV=production / IP_SOURCE=CfConnectingIp).
      RUST_ENV: development
      IP_SOURCE: ConnectInfo
    ports:
      - "127.0.0.1:8888:8888"
