# Build + push two runtime images. After both master images publish, CI tells
# Dokploy to redeploy; pull_policy: always fetches new latest tags.
#
# Both Dockerfiles are packaging-only: the artifacts are produced by these jobs and COPYed
# in. That is why each build job does its own toolchain work before touching Docker.
#
# The build jobs export image tars and never touch the registry: registry writes happen
# only in the publish job, which runs solely on non-PR events and is the only job holding
# a packages:write token. A pull_request run executes the PR's own copy of this file, so
# it must never be handed a token that can move `latest` or reach Dokploy.
#
# db/ is gitignored, so a fresh clone has no databases: deploy/fetch-quran-db.sh pulls them
# from the public R2 base (see that script), cached between runs because the corpus is
# immutable. Web needs the Arabic set plus the generated catalogue (the sha-guard test's
# input); the Rust gates need `all` — cargo test opens the corpus through db/quran.
name: images

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# One build per ref. A superseded master push has nothing worth finishing.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

# Baseline for every job, including pull_request runs. The publish job overrides
# this with packages:write — no other job can write to the registry, and no PR
# path can reach a write token at all.
permissions:
  contents: read

env:
  # Same coordinates the justfile and docker-compose.yml resolve: ghcr.io/<owner>/easyquran-*
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  meta:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      push: ${{ github.event_name != 'pull_request' }}
    steps:
      # A tag ships its own name (v1.2.0); a branch build ships the short sha. This value
      # only lands in the image's OCI version label — the registry tags come from
      # docker/metadata-action below. ref_name is injectable via a crafted tag name, so it
      # reaches the shell only through the env block, never as a raw interpolation.
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

  web:
    needs: meta
    # Same-repo PRs only: a fork PR cannot be trusted with two arm64 build
    # runners (it still executes its own copy of this workflow).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      # Bun owns the workspace: bun.lock carries catalog + patchedDependencies
      # (root package.json). Node 24 still runs svelte-check, vitest and tsx.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24

      # adapter-bun calls Bun.build during adapt(), so the web build itself must
      # run under bun (`bun run --bun vite build` in the build script). Pinned to the
      # runtime the image ships (oven/bun:1.4.3-slim).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3

      # The Quran corpus is immutable and unversioned, so the cache key tracks the baked
      # maps that name the artifacts, not the bytes.
      - name: Cache Quran databases
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: db/quran
          key: quran-db-${{ hashFiles('web/src/lib/quran/view/source-profiles.ts') }}

      # Arabic + metadata is all the prerender needs; the catalogue step is offline and
      # only writes the generated runtime catalogue the web sha-guard test reads (db/ is
      # gitignored, so a fresh runner has neither).
      - name: Provision Quran databases
        run: |
          deploy/fetch-quran-db.sh
          deploy/fetch-quran-db.sh catalogue

      - run: bun install --frozen-lockfile

      - name: Web security gates
        working-directory: web
        run: |
          bun run check
          bun run lint
          bun run test

      - name: JavaScript dependency audit
        run: bun audit

      - name: Check Quran publisher
        run: bun run quran:check

      # adapter-bun output is pure JS (arch-independent). The whole build — vite,
      # the Arabic sqlite prerender (bun 1.4+ implements node:sqlite), and the
      # adapter's Bun.build pass — runs under bun via the build script.
      - run: bun run --filter web build
        env:
          PUBLIC_ENV: prod

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - id: tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/easyquran-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=ref,event=pr
            type=sha,format=short

      # Build to a tar (tags/labels baked in) — this job has no registry
      # credentials at all; the publish job loads and pushes the tars.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deploy/Dockerfile.web
          platforms: linux/arm64
          build-args: VERSION=${{ needs.meta.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          outputs: type=docker,dest=/tmp/easyquran-web.tar
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # PR runs build purely as validation; only the push path ships the tar.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: needs.meta.outputs.push == 'true'
        with:
          name: easyquran-web-image
          path: /tmp/easyquran-web.tar
          retention-days: 1

  api:
    needs: meta
    # Same-repo PRs only — see the web job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: rust
          # The vendored OpenSSL build lives in target/ and is expensive; keep it cached
          # even when a build fails partway.
          cache-on-failure: true

      # cargo test opens the corpus through CARGO_MANIFEST_DIR/../../../db/quran, and db/
      # is gitignored — the runner needs the full set (arabic + metadata + every
      # translation sqlite + the generated catalogue) before the gates. Same immutable
      # files as the web job, so the key tracks the baked maps, not the bytes.
      - name: Cache Quran databases
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: db/quran
          key: quran-db-all-${{ hashFiles('web/src/lib/data/translations.json', 'web/src/lib/quran/view/source-profiles.ts') }}

      - name: Provision Quran databases
        run: deploy/fetch-quran-db.sh all

      # `--target` (rather than a bare release build) puts the binary at the path
      # Dockerfile.api COPYs. `vendored-openssl` is not a cross-build workaround here — the
      # runtime image (debian:trixie-slim) carries no libssl, so the binary must not link
      # one dynamically.
      - name: Rust security gates
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked -- --test-threads=1
          cargo check --locked -p ruxlog --features seed-system --bin ruxlog_tui --bin seed_now

      - name: Install dependency auditor
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Rust dependency audit
        run: |
          python3 -m unittest discover -s scripts/security -p 'test_*.py'
          python3 scripts/security/cargo-audit-gate.py

      - name: Build ruxlog
        working-directory: rust
        run: |
          cargo build --release --locked -p ruxlog \
            --features vendored-openssl \
            --target aarch64-unknown-linux-gnu

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - id: tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/easyquran-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=ref,event=pr
            type=sha,format=short

      # Build to a tar (tags/labels baked in) — this job has no registry
      # credentials at all; the publish job loads and pushes the tars.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deploy/Dockerfile.api
          platforms: linux/arm64
          build-args: VERSION=${{ needs.meta.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          outputs: type=docker,dest=/tmp/easyquran-api.tar
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Check API runtime libraries
        env:
          API_IMAGE_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          docker load -i /tmp/easyquran-api.tar
          read -r image <<< "$API_IMAGE_TAGS"
          docker run --rm --entrypoint /lib/ld-linux-aarch64.so.1 "$image" --list /app/ruxlog

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: needs.meta.outputs.push == 'true'
        with:
          name: easyquran-api-image
          path: /tmp/easyquran-api.tar
          retention-days: 1

  # The only job with packages:write, and it never runs for pull_request events
  # (a PR executes its own copy of this file, so the gate must be the event
  # itself, not anything PR-controlled). Loading an arm64 tar on an amd64
  # runner is fine — pushing is manifest work, not execution.
  publish:
    needs: [meta, web, api]
    if: github.event_name != 'pull_request' && needs.meta.outputs.push == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: easyquran-*-image
          path: /tmp
          merge-multiple: true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push every tag baked into the tars (latest, short sha, v*/pr-N as applicable).
      - name: Push images
        run: |
          docker load -i /tmp/easyquran-web.tar
          docker load -i /tmp/easyquran-api.tar
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep "^$REGISTRY/easyquran-" \
            | while read -r ref; do docker push "$ref"; done

  # Runs after both images publish. Tags do not move the stack's latest tag.
  deploy:
    needs: publish
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - name: Redeploy Dokploy compose app
        env:
          DOKPLOY_API_URL: ${{ secrets.DOKPLOY_API_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          set -euo pipefail
          : "${DOKPLOY_API_URL:?Set production secret DOKPLOY_API_URL}"
          : "${DOKPLOY_API_KEY:?Set production secret DOKPLOY_API_KEY}"
          : "${DOKPLOY_COMPOSE_ID:?Set production secret DOKPLOY_COMPOSE_ID}"

          body=$(jq -cn --arg compose_id "$DOKPLOY_COMPOSE_ID" '{composeId: $compose_id}')
          curl --fail-with-body --silent --show-error -K - \
            --header 'content-type: application/json' \
            --data "$body" \
            "$DOKPLOY_API_URL/compose.redeploy" <<EOF
          header = "x-api-key: $DOKPLOY_API_KEY"
          EOF
