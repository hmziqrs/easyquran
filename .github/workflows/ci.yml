name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel in-flight runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web (fmt · lint · check · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No root package.json in this workspace, so pin pnpm explicitly.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      # Install the whole workspace from the root lockfile.
      - run: pnpm install --frozen-lockfile

      # Quality gate — each step fails the job on the first breakage.
      - run: pnpm -C web format:check
      - run: pnpm -C web lint
      - run: pnpm -C web check
      - run: pnpm -C web test
      - run: pnpm -C web build
