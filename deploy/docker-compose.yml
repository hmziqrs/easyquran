# EasyQuran app stack — web + api only.
#
# Traefik is EXTERNAL to this repo (a shared/global proxy on the VPS). This file
# only defines the two app containers + the Traefik LABELS your external proxy
# auto-discovers via its docker provider. There is no Traefik service here, no
# proxy config file, no ACME — that's all the external proxy's job.
#
# Routing (from the labels), all on DOMAIN:
#   Host(DOMAIN) && PathPrefix(`/api`) → api:8888   (strip /api, priority 100)
#   Host(DOMAIN)                        → web:8080
#
# Usage (from repo root):
#   cp deploy/.env.example deploy/.env && $EDITOR deploy/.env
#   docker compose -f deploy/docker-compose.yml up -d --build
# (compose auto-loads deploy/.env for ${...} interpolation + the api env_file.)
#
# Project/group name. Every container gets `com.docker.compose.project=<this>`,
# so Docker Desktop / Portainer / `docker compose ps` show web + api grouped as
# one stack. Defaults to "easyquran" even if .env is missing.

name: ${PROJECT:-easyquran}

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
        INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL}
        VERSION: ${VERSION:-dev}
    image: ${PROJECT}/web:latest
    container_name: ${PROJECT}_web
    networks:
      proxy:
        aliases: [web]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXY_NETWORK}"
      - "traefik.http.routers.web.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.web.entrypoints=${HTTPS_ENTRYPOINT}"
      - "traefik.http.routers.web.tls=true"
      - "traefik.http.routers.web.tls.certresolver=${ACME_RESOLVER}"
      - "traefik.http.services.web.loadbalancer.server.port=8080"
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        VERSION: ${VERSION:-dev}
    image: ${PROJECT}/api:latest
    container_name: ${PROJECT}_api
    env_file: [.env]
    environment:
      HOST: "0.0.0.0"
      PORT: "8888"
      DATABASE_URL: "sqlite:./data/easyquran.db?mode=rwc"
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - api_data:/app/data
    networks:
      proxy:
        aliases: [api]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXY_NETWORK}"
      - "traefik.http.routers.api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=${HTTPS_ENTRYPOINT}"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=${ACME_RESOLVER}"
      - "traefik.http.routers.api.priority=100"
      # strip /api so the backend (which serves /healthz, /auth/v1, … at root)
      # gets clean paths: easyquran.fyi/api/healthz → /healthz.
      - "traefik.http.routers.api.middlewares=strip-api@docker"
      - "traefik.http.services.api.loadbalancer.server.port=8888"
      - "traefik.http.middlewares.strip-api.stripprefix.prefixes=/api"
      - "traefik.http.middlewares.strip-api.stripprefix.forceslash=false"
    restart: unless-stopped

networks:
  # EXTERNAL — owned by your global Traefik. Both containers attach here so the
  # proxy can reach them; the labels above tell it how to route.
  proxy:
    name: ${PROXY_NETWORK}
    external: true

volumes:
  api_data: {}
