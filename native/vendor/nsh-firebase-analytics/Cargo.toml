[package]
name = "nsh-firebase-analytics"
description = "Firebase analytics for Native Shell Rust apps: events, user properties, screen views, consent, a clock-driven batching queue and pluggable transports"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/SuperNSH/firebase"
authors = ["hmziqrs"]
publish = false
keywords = ["nsh", "firebase", "analytics", "ga4"]

[dependencies]
nsh-core = "0.7.1"
nsh-firebase-core = { version = "0.1.0", path = "../nsh-firebase-core" }
serde_json = "1"
