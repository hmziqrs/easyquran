[package]
name = "eq-core"
version = "0.1.0"
edition = "2024"
publish = false
description = "EasyQuran native domain logic: no NSH dependency, cargo-testable without an engine."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Shared sync merge rules (contracts/sync.md). Read-only: owned by rust/.
eq-sync-core = { path = "../../../rust/crates/eq-sync-core" }
