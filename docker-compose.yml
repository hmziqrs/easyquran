# EasyQuran app stack — web (+ api) at the repo root.
#
# Why root: Dokploy writes the .env (from your Environment tab) at the code root
# and sources it relative to the compose file. With the compose in a subdirectory
# those paths differ and the deploy fails with ".../code/deploy/.env: No such
# file or directory". At the root they agree. Run locally with `docker compose
# up` from the repo root.
#
# This stack builds nothing. Images come from the registry, built and pushed from a dev
# machine with `just images` / `just push` (see deploy/README.md → Images). Override the
# coordinates with REGISTRY and VERSION in .env; VERSION defaults to `latest`.
#
# Routing (from the labels), all on DOMAIN:
#   Host(DOMAIN) && PathPrefix(`/api`) && !PathPrefix(`/api/healthz`) → api:8888   (strip /api, priority 100)
#   Host(DOMAIN)                                                        → web:8080
# /healthz is NOT on the public host router — only the in-container healthcheck
# (curl localhost:8888/healthz) or a Docker-network monitor (api:8888/healthz) reaches it.

name: ${PROJECT:-easyquran}

services:
  web:
    # No `build:` on purpose. Images are built on a developer machine (`just images`) and
    # pushed to the registry (`just push`); this stack only ever PULLS. Building the web
    # image from source inside Docker — toolchain install, CA certs, sqlite prerender — was
    # the single most failure-prone step in the deploy and is gone.
    # PUBLIC_* are runtime $env/dynamic/public (NOT build-baked) and are set in
    # web.environment below, so a new PUBLIC_* value needs no new image.
    image: ${REGISTRY:-ghcr.io/hmziqrs}/easyquran-web:${VERSION:-latest}
    # CI republishes the mutable `latest` tag on every master push; without this a redeploy
    # would restart the cached digest and silently ship the previous build.
    pull_policy: always
    container_name: ${PROJECT:-easyquran}_web
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      ORIGIN: https://${DOMAIN}
      # Co-located invariant: web + api share one Docker network. Server-side
      # translation SSR hits the api container directly (bypassing the edge) and
      # sends INTERNAL_QURAN_API_TOKEN on this base only.
      INTERNAL_QURAN_API_BASE: http://api:8888/quran
      # Server-only: proves trusted Docker-internal SSR to the API identity gate.
      # Compose interpolates this from .env; never expose under a PUBLIC_ var.
      INTERNAL_QURAN_API_TOKEN: ${INTERNAL_QURAN_API_TOKEN}
      # Browser-facing API base, derived from DOMAIN. Read at runtime via
      # $env/dynamic/public (NOT build-baked), so these live here, not in build args.
      PUBLIC_API_BASE_URL: https://${DOMAIN}/api
      PUBLIC_QURAN_API_BASE: https://${DOMAIN}/api/quran
      QURAN_SSR_CACHE_DIR: /app/cache/quran-ssr
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # `bun`, not `node`: the web image runs the adapter-node server on the bun runtime and
      # carries no node binary.
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:8080/health/quran').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - web_quran_cache:/app/cache/quran-ssr
    networks:
      proxy:
        aliases: [web]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXY_NETWORK:-dokploy-network}"
      - "traefik.http.routers.web.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.web.entrypoints=${HTTPS_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.web.tls=true"
      - "traefik.http.routers.web.tls.certresolver=${ACME_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.web.middlewares=easyquran-web-compress@docker"
      - "traefik.http.services.web.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.easyquran-web-compress.compress=true"
    restart: unless-stopped

  api:
    # Pull-only, same as web — built by `just image-api` (cargo-zigbuild) and pushed.
    image: ${REGISTRY:-ghcr.io/hmziqrs}/easyquran-api:${VERSION:-latest}
    pull_policy: always
    container_name: ${PROJECT:-easyquran}_api
    env_file: [.env]
    environment:
      HOST: "0.0.0.0"
      PORT: "8888"
      DATABASE_URL: "sqlite:./data/easyquran.db?mode=rwc"
      RUST_LOG: ${RUST_LOG:-info}
      # Topology invariants (literal — must NOT be overridable to an insecure
      # value): this stack always runs co-located behind Cloudflare->Traefik.
      RUST_ENV: production
      # Verified client IP behind Cloudflare->Traefik. Origin ingress MUST be
      # restricted to Cloudflare ranges (see deploy/README.md) — the api trusts
      # this header, so only the network path can keep it unforgeable.
      IP_SOURCE: CfConnectingIp
      # S3 dummies + MAIL=none satisfy the unconditional boot gate
      # (ObjectStorageConfig::from_env .expect()s on the four required S3 keys).
      # Interpolated, NOT literal: set the real value in .env (Dokploy env tab)
      # to wire media/auth and it overrides cleanly. The reader never touches S3.
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCOUNT_ID: ${S3_ACCOUNT_ID:-local}
      S3_BUCKET: ${S3_BUCKET:-easyquran-assets}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-devkey}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-devsecret}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://localhost:9000}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://r2.easyquran.fyi}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-none}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@easyquran.fyi}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-EasyQuran}
    volumes:
      - api_data:/app/data
      # Immutable Quran sources (read-only). 1:1 with the /app/quran ENV paths in
      # Dockerfile.api. db/ is gitignored: the DBs live in R2 and must be provisioned onto
      # the host (incl. the Dokploy checkout) before the api starts — a clone alone has none.
      - ./db/quran:/app/quran:ro
    networks:
      proxy:
        aliases: [api]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/healthz && curl -fsS http://localhost:8888/quran/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXY_NETWORK:-dokploy-network}"
      - "traefik.http.routers.api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`) && !PathPrefix(`/api/healthz`)"
      - "traefik.http.routers.api.entrypoints=${HTTPS_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=${ACME_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.api.priority=100"
      - "traefik.http.routers.api.middlewares=strip-api@docker"
      - "traefik.http.services.api.loadbalancer.server.port=8888"
      - "traefik.http.middlewares.strip-api.stripprefix.prefixes=/api"
      - "traefik.http.middlewares.strip-api.stripprefix.forceslash=false"
    restart: unless-stopped

networks:
  proxy:
    name: ${PROXY_NETWORK:-dokploy-network}
    external: true

volumes:
  api_data: {}
  web_quran_cache: {}
