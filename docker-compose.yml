# EasyQuran app stack — web (+ api) at the repo root.
#
# Why root: Dokploy writes the .env (from your Environment tab) at the code root
# and sources it relative to the compose file. With the compose in a subdirectory
# those paths differ and the deploy fails with ".../code/deploy/.env: No such
# file or directory". At the root they agree. Run locally with `docker compose
# up` from the repo root.
#
# Build context is the repo root (context: .), so the Dockerfiles under deploy/
# and the build-time data files under db/ resolve correctly.
#
# NOTE: the `api` service is COMMENTED OUT for a web-only deploy. The web reader
# is static and doesn't depend on the API (it reads baked constants + fetches the
# Arabic sqlite directly from R2). To re-enable the API later: uncomment the block
# below AND first add `curl` to deploy/Dockerfile.api's builder apt-get (the
# utoipa-swagger-ui build script needs curl to fetch Swagger UI — without it the
# Rust build fails with "`curl` command not found").
#
# Routing (from the labels), all on DOMAIN:
#   Host(DOMAIN) && PathPrefix(`/api`) → api:8888   (strip /api, priority 100)  [disabled]
#   Host(DOMAIN)                        → web:8080

name: ${PROJECT:-easyquran}

services:
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
        INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL}
        VERSION: ${VERSION:-dev}
        REVISION: ${REVISION:?REVISION must be set for a container build}
    image: ${PROJECT:-easyquran}/web:latest
    container_name: ${PROJECT:-easyquran}_web
    networks:
      proxy:
        aliases: [web]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXY_NETWORK}"
      - "traefik.http.routers.web.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.web.entrypoints=${HTTPS_ENTRYPOINT}"
      - "traefik.http.routers.web.tls=true"
      - "traefik.http.routers.web.tls.certresolver=${ACME_RESOLVER}"
      - "traefik.http.services.web.loadbalancer.server.port=8080"
    restart: unless-stopped

  # ── API (Rust/Axum) — disabled for web-only deploy. Uncomment to re-enable. ──
