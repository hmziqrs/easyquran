  #   build:
  #     context: .
  #     dockerfile: deploy/Dockerfile.api
  #     args:
  #       VERSION: ${VERSION:-dev}
  #   image: ${PROJECT:-easyquran}/api:latest
  #   container_name: ${PROJECT:-easyquran}_api
  #   env_file: [.env]
  #   environment:
  #     HOST: "0.0.0.0"
  #     PORT: "8888"
