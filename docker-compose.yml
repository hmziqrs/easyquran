# EasyQuran app stack — web (+ api) at the repo root.
#
# Why root: Dokploy writes the .env (from your Environment tab) at the code root
# and sources it relative to the compose file. With the compose in a subdirectory
# those paths differ and the deploy fails with ".../code/deploy/.env: No such
# file or directory". At the root they agree. Run locally with `docker compose
# up` from the repo root.
#
# Build context is the repo root (context: .), so the Dockerfiles under deploy/
# and the build-time data files under db/ resolve correctly.
#
# Routing (from the labels), all on DOMAIN:
#   Host(DOMAIN) && PathPrefix(`/api`) && !PathPrefix(`/api/healthz`) → api:8888   (strip /api, priority 100)
#   Host(DOMAIN)                                                        → web:8080
# /healthz is NOT on the public host router — only the in-container healthcheck
# (curl localhost:8888/healthz) or a Docker-network monitor (api:8888/healthz) reaches it.

name: ${PROJECT:-easyquran}

services:
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
        PUBLIC_QURAN_API_BASE: ${PUBLIC_QURAN_API_BASE}
        INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL}
        VERSION: ${VERSION:-dev}
    image: ${PROJECT:-easyquran}/web:latest
    container_name: ${PROJECT:-easyquran}_web
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      ORIGIN: https://${DOMAIN}
      INTERNAL_QURAN_API_BASE: ${INTERNAL_QURAN_API_BASE}
      # Server-only: proves trusted Docker-internal SSR to the API identity gate.
      # Compose interpolates this from .env; never expose under a PUBLIC_ var.
      INTERNAL_QURAN_API_TOKEN: ${INTERNAL_QURAN_API_TOKEN}
      QURAN_SSR_CACHE_DIR: /app/cache/quran-ssr
      QURAN_SSR_CACHE_TTL_MS: ${QURAN_SSR_CACHE_TTL_MS:-604800000}
      QURAN_SSR_CACHE_BUDGET_BYTES: ${QURAN_SSR_CACHE_BUDGET_BYTES:-268435456}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # `bun`, not `node`: the web image runs the adapter-node server on the bun runtime and
      # carries no node binary.
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:8080/health/quran').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - web_quran_cache:/app/cache/quran-ssr
    networks:
      proxy:
        aliases: [web]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXY_NETWORK}"
      - "traefik.http.routers.web.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.web.entrypoints=${HTTPS_ENTRYPOINT}"
      - "traefik.http.routers.web.tls=true"
      - "traefik.http.routers.web.tls.certresolver=${ACME_RESOLVER}"
      - "traefik.http.routers.web.middlewares=easyquran-web-compress@docker"
      - "traefik.http.services.web.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.easyquran-web-compress.compress=true"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
      args:
        VERSION: ${VERSION:-dev}
    image: ${PROJECT:-easyquran}/api:latest
    container_name: ${PROJECT:-easyquran}_api
    env_file: [.env]
    environment:
      HOST: "0.0.0.0"
      PORT: "8888"
      DATABASE_URL: "sqlite:./data/easyquran.db?mode=rwc"
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - api_data:/app/data
      # Immutable Quran sources (read-only). 1:1 with the /app/quran ENV paths in
      # Dockerfile.api. Plain git blobs (no LFS) — present in every clone, incl. Dokploy.
      - ./db/quran/tanzil:/app/quran:ro
    networks:
      proxy:
        aliases: [api]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/healthz && curl -fsS http://localhost:8888/quran/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXY_NETWORK}"
      - "traefik.http.routers.api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`) && !PathPrefix(`/api/healthz`)"
      - "traefik.http.routers.api.entrypoints=${HTTPS_ENTRYPOINT}"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=${ACME_RESOLVER}"
      - "traefik.http.routers.api.priority=100"
      - "traefik.http.routers.api.middlewares=strip-api@docker"
      - "traefik.http.services.api.loadbalancer.server.port=8888"
      - "traefik.http.middlewares.strip-api.stripprefix.prefixes=/api"
      - "traefik.http.middlewares.strip-api.stripprefix.forceslash=false"
    restart: unless-stopped

networks:
  proxy:
    name: ${PROXY_NETWORK}
    external: true

volumes:
  api_data: {}
  web_quran_cache: {}
