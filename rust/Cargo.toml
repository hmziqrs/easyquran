# EasyQuran Rust workspace — ruxlog backend port (Axum + sea-orm): backend/api (ruxlog + rux-* crates), backend/api/migration, crates/ruxlog-types.
[workspace]
members = [
    "backend/api",
    "backend/api/crates/rux-auth",
    "backend/api/crates/rux-fcm",
    "backend/api/crates/rux-provider-core",
    "backend/api/crates/rux-request-gate",
    "backend/api/crates/rux-webhook-crypto",
    "backend/api/migration",
    "crates/ruxlog-types",
]
resolver = "2"

[workspace.package]
edition = "2021"

# ruxlog's frontend profiles are dropped; this workspace is backend-only. Add release-tuning profiles as needed.
