[package]
name = "ruxlog"
default-run = "ruxlog"
version = "0.1.0"
edition = "2021"
# Self-hosted binary, never published; `publish = false` also makes cargo-deny's licenses.private skip this crate's absent license field, matching the other private path-crates.
publish = false

[features]
# `openapi` is on by default — §6.1 documents `GET /openapi.json` on the public branch, so the shipped build must serve it. (`seed-system` stays off; see below.)
default = ["openapi"]
# Security: the seeder + admin TUI use a predictable ChaCha20 RNG seed and must never ship in a release binary — excluded from default; do not enable for releases.
seed-system = []
# OpenAPI docs (utoipa + swagger UI). Serves `GET /quran/openapi.json` (§6.1).
openapi = ["utoipa", "utoipa-swagger-ui"]

[dependencies]
rux-auth = { path = "./crates/rux-auth" }
migration = { path = "./migration" }
ruxlog-types = { path = "../../crates/ruxlog-types", features = ["backend", "slug"] }
rux-webhook-crypto = { path = "./crates/rux-webhook-crypto" }
rux-request-gate = { path = "./crates/rux-request-gate" }
rux-provider-core = { path = "./crates/rux-provider-core" }
rux-fcm = { path = "./crates/rux-fcm" }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
webauthn-rs-proto = { version = "0.5" }
url = { version = "2.5" }
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.10.1", features = [
    "typed-header",
    "cookie",
    "query",
] }
sea-orm = { version = "1.1.2", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "debug-print",
    "with-chrono",
    "with-json",
] }
# axum-login removed - replaced by rux-auth
fake = { version = "4.3.0", features = ["derive"] }
validator = { version = "0.20.0", features = ["derive"] }
axum-valid = { version = "0.23.0", default-features = false, features = [
    "basic",
    "validator",
    "into_json",
] }
serde_json = "1.0.130"
tokio = { version = "1.45", features = ["full"] }
serde = { version = "1.0.225", features = ["derive"] }
# validator = { version = "0.16.1", features = ["derive"] }
tower-http = { version = "0.6.2", features = [
    "trace",
    "compression-gzip",
    "cors",
    "limit",
    "fs",
] }
tower-sessions = { version = "0.14", features = ["private"] }
# MessagePack codec for the SqliteSessionStore's serialized session values.
rmp-serde = "1.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
tracing = "0.1.41"
opentelemetry = { version = "0.31.0", features = ["metrics", "trace", "logs"] }
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio", "metrics", "trace", "logs"] }
opentelemetry-otlp = { version = "0.31.0", features = ["http-proto", "reqwest-blocking-client", "metrics", "logs", "trace"] }
tracing-opentelemetry = "0.32.0"
opentelemetry-appender-tracing = "0.31.1"
opentelemetry-semantic-conventions = "0.31.0"
dotenvy = "0.15.7"
chrono = { version = "0.4.40", features = ["serde"] }
axum-macros = "0.5.0"
thiserror = "2.0.12"
password-auth = "1.0.0"
time = "0.3.47"
hex = "0.4.3"
sha2 = "0.10.8"
base64 = "0.22.1"
rand = "0.9"
# CRYP-RNG-006: explicit ChaCha20 RNG so seeders pull from OS entropy (ChaCha20Rng::from_os_rng) instead of a predictable StdRng::seed_from_u64.
rand_chacha = "0.9"
clap = { version = "4.5", features = ["derive"] }
axum-client-ip = "1.0.0"
# DEPS-NATIVE-TLS-1: standardize outbound TLS on rustls — `tokio1-rustls-tls` gives the async executor + rustls STARTTLS/TLS backend for AsyncSmtpTransport; native-tls/OpenSSL is no longer linked.
lettre = { version = "0.11.22", default-features = false, features = [
    "smtp-transport",
    "builder",
    "tokio1-rustls-tls",
] }
regex = "1.12"
lazy_static = "1.5.0"
async-trait = "0.1.88"
tera = "1"
log = "0.4.27"

# DEPS-AWS-SDK-LEGACY-TLS: AWS SDK defaults compile BOTH the legacy HTTPS stack (hyper 0.14 + rustls 0.21 + webpki 0.101, carrying RUSTSEC-2026-0098/0099/0104) and the modern one; the app uses only the modern client, so default-features=false on BOTH crates + rt-tokio + default-https-client drops the legacy stack (then the 3 deny.toml RUSTSEC ignores can be deleted). Both crates must change together or feature-unification re-pulls the legacy stack.
aws-config = { version = "1.6.2", default-features = false, features = [
    "behavior-version-latest",
    "rt-tokio",
    "default-https-client",
] }
aws-sdk-s3 = { version = "1.83.0", default-features = false, features = [
    "behavior-version-latest",
    "rt-tokio",
    "default-https-client",
] }
uuid = { version = "1.17", features = ["v4", "fast-rng"] }
base32 = "0.5.1"
hmac = "0.12.1"
sha1 = "0.10.6"
# AES-256-GCM field-level encryption at rest (payout_accounts.metadata, CWE-312); declared explicitly so field-crypto owns a stable version. See utils::field_crypto (V-MED-11).
aes-gcm = "0.10.3"
# Constant-time comparison used by every webhook verifier + 2FA. See plan 1c.
subtle = "2.6.1"
# Best-effort in-memory secret hygiene (CWE-316/459): `zeroize` scrubs transient field-encryption key arrays on drop; the master key lives in a `static OnceLock<Zeroizing<_>>` (scrubbed if dropped locally — but Rust doesn't Drop statics at exit, so master-key teardown is best-effort). See utils::field_crypto (GAP-016).
zeroize = { version = "1", features = ["derive"] }
# CRYP-ENC-012: best-effort secret hygiene for billing provider credentials — wrapping in `secrecy::SecretString` makes reads opt-in (.expose_secret()) and gives a redacting Debug by default, so a derived Debug or accidental {:?} never leaks a live credential. See state::ObjectStorageConfig for the same discipline.
secrecy = "0.10"
# Paddle Billing signs webhooks with Ed25519. See plan 1b (Paddle).
ed25519-dalek = { version = "2.1.1", default-features = false }
# HTML allowlist sanitizer for stored post content (EditorJS blocks): strips <script>/event handlers/`javascript:` URLs server-side on read, rendering the `dangerous_inner_html` frontend sinks inert. See plan Phase 6e.
ammonia = "4"
data-encoding = "2.3.3"
getrandom = "0.2"
urlencoding = "2.1.3"
imagesize = "0.12.0"
bytes = "1.11.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff"] }
# DEPS-NATIVE-TLS-1: rustls for the direct HTTP client — default-features=false drops reqwest's default-tls (native-tls/OpenSSL); we re-add charset + http2 and take TLS from rustls-tls, keeping all outbound TLS on the audited rustls/webpki chain.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "cookies",
    "rustls-tls",
    "charset",
    "http2",
] }
maxminddb = "0.27"
tower = { version = "0.5", features = ["util"] }
oauth2 = { version = "4.4" }
# jsonwebtoken: floor raised to 10.4 — CVE-2026-25537 (type confusion) affects <10.3.0; the root lockfile resolves 10.4.0, and pinning the floor here guarantees a future resolve can't pull a vulnerable 10.2.x.
jsonwebtoken = { version = "10.4", features = ["aws_lc_rs"] }
ratatui = "0.29"
crossterm = "0.29"
tuirealm = "3.2.0"
utoipa = { version = "5", features = ["axum_extras"], optional = true }
utoipa-swagger-ui = { version = "9", features = ["axum"], optional = true }
# Quran content API (Phase 0): sqlx is a DIRECT dep (already transitively via sea-orm's sqlx-sqlite) so the Quran loader opens its OWN read-only SQLite connection to the Arabic artifacts — independent of sea_db (§2) and of rusqlite (which would collide on links="sqlite3" with libsqlite3-sys; §8.3). modules/quran_v1/ never references sqlx (§10).
sqlx = { version = "0.8", default-features = false, features = [
    "sqlite",
    "runtime-tokio-rustls",
] }
# roxmltree: pure-Rust DOM XML parser for the 77 KB quran-data.xml read once at boot (§8.3); not quick-xml (absent from the graph).
roxmltree = "0.20"
# Declared explicitly (both resolve transitively today) so the Quran store and shared search normalization own a stable version floor (§8.3).
memchr = "2"
unicode-normalization = "0.1"
# On-demand cached pool for translation corpora (§3). future feature = async try_get_with for single-flight cold builds.
moka = { version = "0.12", features = ["future"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"

[[bin]]
name = "generate_hash"
path = "scripts/generate_hash.rs"

[[bin]]
name = "generate_csrf"
path = "scripts/generate_csrf.rs"

[[bin]]
name = "archive_changes"
path = "scripts/archive_changes.rs"

[[bin]]
name = "restore_changes"
path = "scripts/restore_changes.rs"

[[bin]]
name = "ruxlog_tui"
path = "scripts/ruxlog_tui.rs"
required-features = ["seed-system"]

[[bin]]
name = "seed_now"
path = "scripts/seed_now.rs"
required-features = ["seed-system"]
