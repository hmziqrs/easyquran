[package]
name = "rux-provider-core"
version = "0.1.0"
edition = "2021"
description = "Domain-free plumbing shared by the mail and billing provider stacks: WebhookEvent envelope, Provider marker, ProviderRegistry, FrameworkError"
publish = false

[dependencies]
thiserror = "2.0"
# `http::HeaderMap` matches axum 0.8's `axum::http::HeaderMap` re-export (http 1.x), so a WebhookEvent built in the api crate type-checks against this crate's.
http = "1.0"
