[package]
name = "rux-request-gate"
version = "0.1.0"
edition = "2021"
description = "In-memory fixed-window rate limiting, dual-threshold abuse limiting, and one-shot dedup for Axum"
publish = false

[dependencies]
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-layer = "0.3"
tower-service = "0.3"
async-trait = "0.1"
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
http = "1.0"
axum-client-ip = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
