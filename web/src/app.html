<!doctype html>
<html lang="en" data-theme="dark" data-accent="emerald">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0c1110" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <!-- Outfit (UI) and Amiri (Arabic) are bundled (self-hosted) via @fontsource
         in layout.css — no render-blocking external stylesheet, no third-party
         request, fonts travel same-origin with the HTML. -->
    <script>
      // Apply saved theme + accent before first paint to avoid a flash.
      // Kept tiny and inline on purpose — it runs synchronously in <head>.
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem("easyquran.prefs") || "{}");
          var d = document.documentElement;
          if (p.theme) d.dataset.theme = p.theme;
          if (p.accent) d.dataset.accent = p.accent;
        } catch (e) {}
      })();
    </script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
