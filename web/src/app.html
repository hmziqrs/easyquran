<!doctype html>
<html lang="en" data-theme="dark" data-surface="ink" data-accent="emerald">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <!-- Figtree (UI) and Amiri (Arabic) are bundled (self-hosted) via @fontsource
         in layout.css — no render-blocking external stylesheet, no third-party
         request, fonts travel same-origin with the HTML. -->
    <script>
      // Apply saved theme + surface + accent before first paint to avoid a
      // flash. Custom seed colours are handled here too, but only the three
      // that are cheap to set flat (--bg / --accent / --pop): the full derived
      // ramp is written by prefs.apply() on mount a moment later, and these
      // three are enough to stop the page flashing the preset background.
      // Kept tiny and inline on purpose — it runs synchronously in <head>.
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem("easyquran.prefs") || "{}");
          var d = document.documentElement;
          if (p.theme) d.dataset.theme = p.theme;
          if (p.surface) d.dataset.surface = p.surface;
          if (p.accent) d.dataset.accent = p.accent;
          var c = p.custom || {};
          if (c.bg) d.style.setProperty("--bg", c.bg);
          if (c.accent) d.style.setProperty("--accent", c.accent);
          if (c.pop) d.style.setProperty("--pop", c.pop);
        } catch (e) {}
      })();
    </script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
